[workspace]
resolver = "2"
members = [
    "crates/impacket-core",
    "crates/impacket-crypto",
    "crates/impacket-ndr",
    "crates/impacket-auth",
    "crates/impacket-krb5",
    "crates/impacket-smb",
    "crates/impacket-dcerpc",
    "crates/impacket-msrpc",
    "crates/impacket-sam",
    "crates/impacket-ldap",
    "crates/impacket-dcom",
    "crates/impacket-relay",
    "crates/impacket-mssql",
    "bins/impacket-rs",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Nestho <nestho@icloud.com>"]
license = "Apache-2.0"
repository = "https://github.com/nestho/impacket-rs"
description = "High-performance, memory-safe pure-Rust redesign of Impacket protocols and Active Directory tools for Linux, macOS, and Windows"
