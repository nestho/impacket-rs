[package]
name = "impacket-cabi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust C ABI and FFI bindings for impacket-rs"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
impacket-core = { path = "../impacket-core", version = "0.6.0" }
impacket-crypto = { path = "../impacket-crypto", version = "0.6.0" }
impacket-auth = { path = "../impacket-auth", version = "0.6.0" }
impacket-ndr = { path = "../impacket-ndr", version = "0.6.0" }
impacket-krb5 = { path = "../impacket-krb5", version = "0.6.0" }
impacket-sam = { path = "../impacket-sam", version = "0.6.0" }
