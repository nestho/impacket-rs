# SonarCloud / SonarQube Configuration for Impacket-RS
sonar.projectKey=nestho_impacket-rs
sonar.organization=nestho
sonar.projectName=impacket-rs

# Source & Test layout
sonar.sources=crates,bins
sonar.tests=crates,bins
sonar.test.inclusions=**/tests/**,**/*_test.rs,**/test.rs,crates/*/tests/**

# Exclusions: exclude visual assets, pre-generated documentation, test fixtures, and binary targets
sonar.exclusions=assets/**,.github/assets/**,docs/**,examples/**,target/**,**/*.svg,**/*.png,**/*.jpg,**/*.md,**/*.json,**/*.html,**/*.lock

# Coverage exclusions: Pure-Rust systems codebase without default lcov pipe
sonar.coverage.exclusions=**/*

# Duplication exclusions: Protocol constants, NDR structures, and RPC opnum tables
sonar.cpd.exclusions=crates/impacket-msrpc/**,crates/impacket-ndr/**,bins/**

# Issue exemptions: Ignore test hashes, mock Kerberos keys, and constant protocol arrays
sonar.issue.ignore.multicriteria=e1,e2,e3

# 1. Hard-coded credentials rule (false positives on protocol test fixtures & LM/NT empty hashes)
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# 2. Hardcoded IP address / localhost rules in network test suites
sonar.issue.ignore.multicriteria.e2.ruleKey=rust:S1313
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# 3. Block duplication rules across protocol definitions
sonar.issue.ignore.multicriteria.e3.ruleKey=common-rust:DuplicatedBlocks
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
