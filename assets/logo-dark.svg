      <path d="M 492 195 L 522 195 L 550 210 L 572 210" 
            fill="none" stroke="#151E28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 492 195 L 522 195 L 550 210 L 572 210" 
            fill="none" stroke="#D45D2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="572" cy="210" r="8" fill="#D45D2E" stroke="#151E28" stroke-width="3"/>
      <circle cx="572" cy="210" r="3.5" fill="#EF7F4E"/>
    </g>

    <!-- Bottom-Left Circuit Group -->
    <g id="bottom-left-circuits">
      <!-- Upper-Left Angled Branch to Node -->
      <path d="M 308 235 L 278 235 L 250 220 L 228 220" 
            fill="none" stroke="#151E28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 308 235 L 278 235 L 250 220 L 228 220" 
            fill="none" stroke="#D45D2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="228" cy="220" r="8" fill="#D45D2E" stroke="#151E28" stroke-width="3"/>
      <circle cx="228" cy="220" r="3.5" fill="#EF7F4E"/>

      <!-- Data Packet Bus Slits -->
      <g stroke="#D45D2E" stroke-width="3.5" stroke-linecap="round">
        <line x1="238" y1="251" x2="244" y2="251"/>
        <line x1="250" y1="251" x2="256" y2="251"/>
        <line x1="262" y1="251" x2="268" y2="251"/>
        <line x1="274" y1="251" x2="280" y2="251"/>
        <line x1="286" y1="251" x2="292" y2="251"/>
