      <path d="M 328 267 L 245 267" 
            fill="none" stroke="#151E28" stroke-width="10" stroke-linecap="round"/>
      <path d="M 328 267 L 245 267" 
            fill="none" stroke="#D45D2E" stroke-width="5" stroke-linecap="round"/>
      <circle cx="245" cy="267" r="8" fill="#D45D2E" stroke="#151E28" stroke-width="3"/>
      <circle cx="245" cy="267" r="3.5" fill="#EF7F4E"/>
    </g>

    <!-- ================= DIAGONAL HIGHWAY CONDUIT ================= -->
    <!-- Dark Silhouette of Highway -->
    <path d="M 270 280 L 530 150" 
          stroke="#151E28" stroke-width="44" stroke-linecap="round"/>
    
    <!-- Highway Body -->
    <path d="M 274 278 L 526 152" 
          stroke="#D45D2E" stroke-width="32" stroke-linecap="round"/>

    <!-- Highway Inner Groove / Accent Borders -->
    <path d="M 276 277 L 524 153" 
          stroke="#151E28" stroke-width="20" stroke-linecap="round"/>
    <path d="M 278 276 L 522 154" 
          stroke="#202A38" stroke-width="14" stroke-linecap="round"/>

    <!-- Dashed Centerline Lane Packets -->
    <path d="M 290 270 L 510 160" 
          stroke="#F1F5F9" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="12 10"/>

    <!-- Central Junction Hub -->
    <circle cx="400" cy="215" r="22" fill="#151E28"/>
    <circle cx="400" cy="215" r="17" fill="#D45D2E"/>
    <circle cx="400" cy="215" r="9" fill="#151E28"/>
    <circle cx="400" cy="215" r="6" fill="#F27A4B"/>
  </g>

