    <circle cx="416" cy="263" r="4" fill="#D45D2E" stroke="#151E28" stroke-width="2"/>

    <!-- ================= CIRCUIT BRANCHES & BUS LINES ================= -->
    <!-- Top-Right Circuit Group -->
    <g id="top-right-circuits">
      <!-- Topmost Horizontal Branch to Node -->
      <path d="M 472 163 L 555 163" 
            fill="none" stroke="#151E28" stroke-width="10" stroke-linecap="round"/>
      <path d="M 472 163 L 555 163" 
            fill="none" stroke="#D45D2E" stroke-width="5" stroke-linecap="round"/>
      <circle cx="555" cy="163" r="8" fill="#D45D2E" stroke="#151E28" stroke-width="3"/>
      <circle cx="555" cy="163" r="3.5" fill="#EF7F4E"/>

      <!-- Data Packet Bus Slits (Clock / Network pulse) -->
      <g stroke="#D45D2E" stroke-width="3.5" stroke-linecap="round">
        <line x1="496" y1="179" x2="502" y2="179"/>
        <line x1="508" y1="179" x2="514" y2="179"/>
        <line x1="520" y1="179" x2="526" y2="179"/>
        <line x1="532" y1="179" x2="538" y2="179"/>
        <line x1="544" y1="179" x2="550" y2="179"/>
        <line x1="556" y1="179" x2="562" y2="179"/>
      </g>

