<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <style>
      .text-impacket { fill: #F8FAFC; transition: fill 0.2s ease; }
      .text-rs { fill: #D45D2E; }
      .concentric-ring { stroke: #F1F5F9; transition: stroke 0.2s ease; }

    </style>

    <linearGradient id="gearLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E26D3E"/>
      <stop offset="50%" stop-color="#D45D2E"/>
      <stop offset="100%" stop-color="#BD4C20"/>
    </linearGradient>

    <linearGradient id="gearDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AD4520"/>
      <stop offset="50%" stop-color="#993B19"/>
      <stop offset="100%" stop-color="#802E10"/>
    </linearGradient>

    <clipPath id="leftGearClip">
      <rect x="0" y="0" width="400" height="560"/>
    </clipPath>
    <clipPath id="rightGearClip">
      <rect x="400" y="0" width="400" height="560"/>
    </clipPath>
  </defs>

  

