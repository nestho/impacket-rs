name: Upstream Impacket Sync Watcher

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from Actions UI

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check Fortra Impacket Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout impacket-rs
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Query Upstream Commits
        id: upstream_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import os

          repo = "fortra/impacket"
          url = f"https://api.github.com/repos/{repo}/commits?sha=master&per_page=5"
          req = urllib.request.Request(url, headers={"User-Agent": "impacket-rs-ci"})
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              req.add_header("Authorization", f"Bearer {token}")
          
          with urllib.request.urlopen(req) as resp:
              commits = json.loads(resp.read().decode("utf-8"))

          latest_sha = commits[0]["sha"]
          summary = commits[0]["commit"]["message"].split("\n")[0]
          author = commits[0]["commit"]["author"]["name"]
          
          print(f"Latest Upstream SHA: {latest_sha}")
          print(f"Commit Summary: {summary} by {author}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"latest_sha={latest_sha}\n")
              f.write(f"summary={summary}\n")
              f.write(f"author={author}\n")
          EOF

      - name: Create Tracking Issue on Diff
        uses: actions/github-script@v7
        with:
          script: |
            const latestSha = process.env.LATEST_SHA;
            const summary = process.env.COMMIT_SUMMARY;
            const author = process.env.COMMIT_AUTHOR;
            
            const title = `[Upstream Sync] New commit on fortra/impacket: ${latestSha.substring(0, 8)}`;
            const body = `### New Upstream Commit Detected
            
            - **Repository**: [fortra/impacket](https://github.com/fortra/impacket)
            - **Commit**: [\`${latestSha.substring(0, 8)}\`](https://github.com/fortra/impacket/commit/${latestSha})
            - **Author**: ${author}
            - **Summary**: ${summary}
            
            #### Target Crate Evaluation Checklist
            - [ ] \`crates/impacket-dcerpc\` / \`crates/impacket-msrpc\`
            - [ ] \`crates/impacket-smb\`
            - [ ] \`crates/impacket-krb5\`
            - [ ] \`crates/impacket-ldap\`
            - [ ] \`bins/impacket-rs\`
            
            *Automated by upstream-sync.yml workflow.*`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['upstream-sync']
            });

            const exists = issues.data.some(issue => issue.title.includes(latestSha.substring(0, 8)));
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['upstream-sync']
              });
              console.log(`Created tracking issue for ${latestSha}`);
            } else {
              console.log(`Issue already exists for ${latestSha}`);
            }
        env:
          LATEST_SHA: ${{ steps.upstream_check.outputs.latest_sha }}
          COMMIT_SUMMARY: ${{ steps.upstream_check.outputs.summary }}
          COMMIT_AUTHOR: ${{ steps.upstream_check.outputs.author }}
