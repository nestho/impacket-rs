name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure stable Rust toolchain
        run: rustup default stable
      - name: Cargo check
        run: cargo check --workspace --all-targets
      - name: Cargo test
        run: cargo test --workspace --verbose

  analysis:
    name: Static Analysis & Linter (Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure stable Rust toolchain with clippy
        run: rustup default stable && rustup component add clippy
      - name: Run Clippy static analysis
        run: cargo clippy --workspace --all-targets

  security:
    name: Security Audit (Trivy + Cargo Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install & Run Trivy Scanner
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnupg lsb-release
          curl -sSf https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y && sudo apt-get install -y trivy
          trivy fs --severity HIGH,CRITICAL --scanners vuln,secret --ignore-unfixed --exit-code 0 .

      - name: Cargo Audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true
