name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Impacket-RS ${{ github.ref_name }}" --generate-notes || true

  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: impacket-rs
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: impacket-rs
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: impacket-rs
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: impacket-rs
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: impacket-rs.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            bin_name: impacket-rs.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tar -czf "impacket-rs-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"
          gh release upload "${{ github.ref_name }}" "impacket-rs-${{ matrix.target }}.tar.gz" --clobber
