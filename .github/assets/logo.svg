<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="100%" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group: Emblem Icon -->
  <g transform="translate(18, 12)">
    <!-- Outer Shield Frame -->
    <path d="M 48 4 L 84 18 C 84 56 68 82 48 94 C 28 82 12 56 12 18 Z" 
          fill="#0B132B" stroke="#1E293B" stroke-width="2.5" />
    
    <!-- Shield Inner Fill Glow -->
    <path d="M 48 8 L 80 21 C 80 54 66 77 48 88 C 30 77 16 54 16 21 Z" 
          fill="url(#coreGlow)" />

    <!-- Stylized Rust Gear Teeth (Tech Accent) -->
    <path d="M 48 14 L 53 14 L 54 18 L 48 19 L 42 18 L 43 14 Z" fill="url(#rustGrad)" />
    <path d="M 76 34 L 79 38 L 76 41 L 72 39 L 72 35 Z" fill="url(#rustGrad)" />
    <path d="M 20 34 L 24 35 L 24 39 L 20 41 L 17 38 Z" fill="url(#rustGrad)" />

    <!-- Central Geometric Node & Packet Network -->
    <path d="M 48 24 L 70 42 L 62 70 L 48 78 L 34 70 L 26 42 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner Anchor & Vector Interlock -->
    <path d="M 48 30 L 48 68 M 38 46 L 58 46 M 34 60 L 48 68 L 62 60" 
          fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Glowing Core Node -->
    <circle cx="48" cy="46" r="4.5" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="48" cy="46" r="2.5" fill="#FFFFFF" />

    <!-- Corner Network Micro-dots -->
    <circle cx="70" cy="42" r="2.5" fill="#38BDF8" />
    <circle cx="26" cy="42" r="2.5" fill="#38BDF8" />
    <circle cx="62" cy="70" r="2.5" fill="url(#rustGrad)" />
    <circle cx="34" cy="70" r="2.5" fill="url(#rustGrad)" />
    <circle cx="48" cy="78" r="3" fill="url(#rustGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(132, 24)">
    <!-- Primary Brand Name -->
    <text x="0" y="44" 
          fill="#F8FAFC" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Inter, Roboto, sans-serif" 
          font-size="40" 
          font-weight="800" 
          letter-spacing="1.5">IMPACKET</text>

    <!-- RS Badge Accent -->
    <g transform="translate(230, 12)">
      <rect x="0" y="0" width="66" height="38" rx="8" fill="url(#rustGrad)" />
      <text x="33" y="26" 
            fill="#FFFFFF" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" 
            font-size="22" 
            font-weight="900" 
            letter-spacing="1" 
            text-anchor="middle">RS</text>
    </g>

    <!-- Subtitle / Tagline: Width verified, fits comfortably with 150px padding to spare -->
    <text x="2" y="68" 
          fill="#94A3B8" 
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="1.4">PURE RUST • ACTIVE DIRECTORY &amp; PROTOCOL ENGINE</text>
  </g>
</svg>
